---
- name: Provision AWS VPC, EC2, and ALB
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    region: ap-south-1
    vpc_cidr: "10.0.0.0/16"
    subnet_cidr: "10.0.1.0/24"
    keypair_name: aap-ec2-win-key
    ec2_instance_type: t3.medium           #t3.micro
    ami_id: ami-09a18c33dcd13da6c # Replace with valid AMI in your region
    tag_project: "AWX-Black-Env"
    private_key_path: /tmp/aap-ec2-win-key.pem

  tasks:


    - name: Create key pair in AWS
      amazon.aws.ec2_key:
        name: "{{ keypair_name }}"
        region: "{{ region }}"
        state: present
      register: ec2_key

    - name: Save private key locally
      ansible.builtin.copy:
        content: "{{ ec2_key.key.private_key }}"
        dest: "{{ private_key_path }}"
        mode: '0600'
      when: ec2_key.changed

    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ tag_project }}-vpc"
        cidr_block: "{{ vpc_cidr }}"
        region: "{{ region }}"
        tags:
          Project: "{{ tag_project }}"
      register: vpc

    - name: Create Subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ subnet_cidr }}"
        az: "{{ region }}a"
        region: "{{ region }}"
        map_public: true
        tags:
          Project: "{{ tag_project }}"
      register: subnet

    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc.id }}"
        state: present
        region: "{{ region }}"
        tags:
          Project: "{{ tag_project }}"
      register: igw

    - name: Create Route Table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        subnets: [ "{{ subnet.subnet.id }}" ]
        region: "{{ region }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
        tags:
          Project: "{{ tag_project }}"
      register: rtb

    - name: Create Security Group for EC2 and ALB
      amazon.aws.ec2_security_group:
        name: "{{ tag_project }}-sg"
        description: "SG for EC2 + ALB"
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ region }}"
        rules:
          - proto: tcp
            ports: [22]
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            ports: [80, 443]
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            ports: [3389, 5985, 5986]
            cidr_ip: 0.0.0.0/0            
        tags:
          Project: "{{ tag_project }}"
      register: sg

    - name: Launch EC2 instance
      amazon.aws.ec2_instance:
        name: "{{ tag_project }}-win-ec2"
        key_name: "{{ keypair_name }}"
        instance_type: "{{ ec2_instance_type }}"
        image_id: "{{ ami_id }}"
        vpc_subnet_id: "{{ subnet.subnet.id }}"
        security_group: "{{ sg.group_id }}"
        region: "{{ region }}"
        wait: true
        user_data: |
          <powershell>
          Enable-PSRemoting -Force
          </powershell>
        network:
          assign_public_ip: true
        tags:
          Project: "{{ tag_project }}"
      register: ec2

    - name: add pause to allow instance to initialize before next workflow job
      ansible.builtin.pause:
        minutes: 3           

    - name: Retrieve and decrypt the Administrator password
      community.aws.ec2_win_password:
        instance_id: "{{ ec2.instances[0].instance_id }}" 
        region: "{{ region }}"
        key_file: "{{ private_key_path }}"
        wait: true
      register: aws_password_result

    - name: Set a variable to be used in a subsequent workflow job
      ansible.builtin.set_stats:
        data:
          aws_password: "{{ aws_password_result.win_password }}"
          ec2_data: "{{ ec2.instances[0].instance_id }}" 
          public_ip: "{{ ec2.instances[0].public_ip_address }}"

- name: Attach credential declaratively using aap API and Collection for automation
  hosts: localhost
  gather_facts: false
  collections:
    - infra.aap_configuration
  vars:
    #private_key_path: /tmp/aap-ec2-win-key.pem
    #controller_validate_certs: false
    controller_credentials:
      - name: AWS EC2 Windows Password
        description: Credentials for AWS EC2 Windows Password
        organization: Default
        credential_type: "Machine"
        inputs:
          username: Administrator
          password: "{{ aws_password }}"
          
  roles:
    - {role: infra.aap_configuration.controller_credentials, when: controller_credentials is defined}