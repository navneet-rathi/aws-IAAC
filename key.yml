- name: Attach credential declaratively using aap API and Collection for automation
  hosts: localhost
  gather_facts: false
  collections:
    - infra.aap_configuration
  vars:
    #controller_hostname: "https://192.168.64.63"
    #controller_oauthtoken: "{{ token }}"
    aap_hostname: "https://192.168.64.63"
    aap_username: "admin"
    aap_password: "primod123"
    aap_token: "h18YfbliJRcOpEVEt1GsnhfThvB6Io"
    aap_validate_certs: false
    private_key_path: /tmp/aap-ec2-key.pem
    #controller_validate_certs: false
    controller_credentials:
      - name: AWS EC2 SSH Key
        description: Credentials for AWS EC2 SSH Key
        organization: Default
        credential_type: "Machine"
        inputs:
          username: ec2-user
          ssh_key_data: "{{ lookup('file', private_key_path) }}"

    controller_templates:
      - name: CIS_Reporting
        organization: Default
        inventory: aws
        credentials:
          - "AWS EC2 SSH Key"

      - name: CIS
        organization: Default
        inventory: aws
        credentials:
          - "AWS EC2 SSH Key" 

      - name: AWS_Infra_Hardning   
        organization: Default
        inventory: aws
        credentials:
          - "AWS EC2 SSH Key"
  pre_tasks:
    - name: Debug - Check if private key file exists
      ansible.builtin.debug:
        msg: "Private key file exists at {{ private_key_path }}"
      failed_when: not lookup('file', private_key_path, errors='ignore')          
  roles:
    - {role: infra.aap_configuration.controller_credentials, when: controller_credentials is defined}
    - infra.aap_configuration.controller_job_templates
      
